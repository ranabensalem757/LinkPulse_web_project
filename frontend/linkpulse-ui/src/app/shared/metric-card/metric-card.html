<article
  class="metric-card"
  [class.metric-card--highlight]="highlight()"
  [attr.aria-label]="title() + ' : ' + value() + (unit() ? ' ' + unit() : '')"
>
  @if (loading()) {
    <div class="metric-card__skeleton" aria-label="Chargement…" role="status">
      <div class="skel skel--title"></div>
      <div class="skel skel--value"></div>
    </div>
  } @else {
    <div class="metric-card__header">
      @if (icon()) {
        <span class="metric-card__icon" aria-hidden="true">{{ icon() }}</span>
      }
      <span class="metric-card__title">{{ title() }}</span>
    </div>
    <div class="metric-card__value">
      {{ value() }}
      @if (unit()) {
        <span class="metric-card__unit">{{ unit() }}</span>
      }
    </div>
    @if (trendLabel()) {
      <div
        class="metric-card__trend"
        [class.metric-card__trend--up]="trend() === 'up'"
        [class.metric-card__trend--down]="trend() === 'down'"
        aria-label="Tendance : {{ trendLabel() }}"
      >
        @if (trend() === 'up') { ↑ }
        @else if (trend() === 'down') { ↓ }
        {{ trendLabel() }}
      </div>
    }
  }
</article>
